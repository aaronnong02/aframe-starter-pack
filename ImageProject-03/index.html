<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moonpetal Grove</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('sky-haze', {
        dependencies: ['material'],
        init() {
          const material = this.el.components.material.material;
          // Use the scene's exact fog color at the horizon and reveal the image overhead.
          material.onBeforeCompile = (shader) => {
            shader.fragmentShader = shader.fragmentShader.replace('#include <fog_fragment>', `
              #if defined(USE_FOG) && defined(USE_MAP)
                float skyVisibility = smoothstep(0.515, 0.605, vMapUv.y);
                gl_FragColor.rgb = mix(fogColor, gl_FragColor.rgb, skyVisibility);
              #endif
            `);
          };
          material.needsUpdate = true;
        }
      });

      AFRAME.registerGeometry('curved-root', {
        schema: {
          length: { default: 2.4, min: 0.5 },
          radius: { default: 0.45, min: 0.05 },
          bend: { default: 0.55 },
          rise: { default: 0.38, min: 0 },
          moss: { default: 0, min: 0, max: 1 }
        },
        init({ length, radius, bend, rise, moss }) {
          const { Vector3, CatmullRomCurve3, TubeGeometry, Color, Float32BufferAttribute, MathUtils } = AFRAME.THREE;
          const path = new CatmullRomCurve3([
            new Vector3(0, rise, 0),
            new Vector3(bend * 0.25, rise * 0.48, length * 0.28),
            new Vector3(bend, 0.03, length * 0.66),
            new Vector3(bend * 0.68, -0.12, length)
          ]);
          const rings = 24;
          const sides = 12;
          const geometry = new TubeGeometry(path, rings, 1, sides, false);
          const positions = geometry.getAttribute('position');
          const vertex = new Vector3();
          const colors = [];
          const bark = new Color('#543838');
          const mossGreen = new Color('#658050');
          const color = new Color();

          for (let ring = 0; ring <= rings; ring++) {
            const progress = ring / rings;
            const center = path.getPointAt(progress);
            const taper = radius * (0.06 + 0.94 * (1 - progress) ** 1.3);
            for (let side = 0; side <= sides; side++) {
              const index = ring * (sides + 1) + side;
              const ridge = 1 + 0.09 * Math.cos(side * Math.PI / 2 + progress * 2);
              vertex.fromBufferAttribute(positions, index).sub(center)
                .multiplyScalar(taper * ridge).add(center);
              positions.setXYZ(index, vertex.x, vertex.y, vertex.z);

              if (moss > 0) {
                const angle = 2 * Math.PI * side / sides;
                const upperSurface = (vertex.y - center.y) / (taper * ridge);
                const mottling = 0.5 + 0.5 * Math.sin(26 * progress + angle * 2) *
                  Math.cos(14 * progress - angle * 3);
                const coverage = moss * MathUtils.smoothstep(upperSurface, 0.12, 0.78) *
                  MathUtils.smoothstep(mottling, 0.19, 0.72) *
                  MathUtils.smoothstep(progress, 0.04, 0.22) *
                  (1 - MathUtils.smoothstep(progress, 0.66, 0.93));
                color.copy(bark).lerp(mossGreen, coverage);
                colors.push(color.r, color.g, color.b);
              }
            }
          }

          if (moss > 0) {
            geometry.setAttribute('color', new Float32BufferAttribute(colors, 3));
          }
          geometry.computeVertexNormals();
          this.geometry = geometry;
        }
      });

      AFRAME.registerGeometry('curled-leaf', {
        schema: {
          curl: { default: 0.06, min: 0, max: 0.15 },
          shape: { default: 0, min: -1, max: 1 }
        },
        init({ curl, shape }) {
          const { BufferGeometry, Float32BufferAttribute } = AFRAME.THREE;
          const positions = [];
          const colors = [];
          const triangles = [];
          const rows = 18;
          const blade = [-1, -0.55, -0.05, 0, 0.05, 0.55, 1];
          const shade = [0.73, 0.92, 0.89, 1.19, 0.89, 0.87, 0.66];

          for (let row = 0; row <= rows; row++) {
            const progress = row / rows;
            const envelope = Math.sin(Math.PI * progress);
            const taper = Math.max(0.004, envelope ** (0.85 + shape * 0.18) * (1.16 - 0.43 * progress));
            for (let column = 0; column < blade.length; column++) {
              const across = blade[column];
              const edgeWave = Math.sin(progress * 19 + shape * 2 + across);
              const edge = 1 + (0.12 * edgeWave + 0.16 * shape * across) * Math.abs(across);
              const x = 0.43 * taper * across * edge + 0.16 * shape * progress ** 2;
              const y = 0.009 + curl * progress ** 4 +
                taper * across ** 4 * (0.018 + 0.014 * edgeWave);
              const tone = shade[column] * (0.88 + 0.12 * envelope);
              positions.push(x, y, 1.6 * progress);
              colors.push(tone, tone, tone);

              if (row > 0 && column > 0) {
                const current = row * blade.length + column;
                const above = current - blade.length;
                triangles.push(above - 1, current - 1, above, above, current - 1, current);
              }
            }
          }

          const geometry = new BufferGeometry();
          geometry.setAttribute('position', new Float32BufferAttribute(positions, 3));
          geometry.setAttribute('color', new Float32BufferAttribute(colors, 3));
          geometry.setIndex(triangles);
          geometry.computeVertexNormals();
          this.geometry = geometry;
        }
      });

      AFRAME.registerGeometry('moss-patch', {
        schema: {
          seed: { default: 0 },
          height: { default: 0.09, min: 0.02, max: 0.16 }
        },
        init({ seed, height }) {
          const { BufferGeometry, Color, Float32BufferAttribute } = AFRAME.THREE;
          const outer = new Color('#314a3b');
          const inner = new Color('#69834c');
          const color = new Color();
          const sides = 36;
          const rings = 9;
          const positions = [0, 0.006 + height * 0.63, 0];
          const colors = [inner.r, inner.g, inner.b];
          const triangles = [];

          for (let ring = 1; ring <= rings; ring++) {
            const radius = ring / rings;
            for (let side = 0; side < sides; side++) {
              const angle = 2 * Math.PI * side / sides;
              const edge = 0.92 + 0.15 * Math.sin(3 * angle + seed) +
                0.09 * Math.cos(5 * angle - seed) + 0.06 * Math.sin(9 * angle + 2 * seed);
              const x = Math.cos(angle) * edge * radius;
              const z = Math.sin(angle) * edge * radius;
              const grain = Math.sin(15 * x + 11 * z + seed) * Math.cos(19 * z - 9 * x - seed);
              const clump = 0.66 + 0.21 * grain + 0.1 * Math.sin(28 * x - 17 * z + seed);
              const y = 0.006 + height * clump * (1 - radius ** 3);
              positions.push(x, y, z);
              color.copy(outer).lerp(inner, (1 - radius ** 4) * (0.62 + 0.29 * grain));
              colors.push(color.r, color.g, color.b);

              const current = 1 + (ring - 1) * sides + side;
              const next = 1 + (ring - 1) * sides + (side + 1) % sides;
              if (ring === 1) {
                triangles.push(0, next, current);
              } else {
                triangles.push(current - sides, next - sides, current, next - sides, next, current);
              }
            }
          }

          const geometry = new BufferGeometry();
          geometry.setAttribute('position', new Float32BufferAttribute(positions, 3));
          geometry.setAttribute('color', new Float32BufferAttribute(colors, 3));
          geometry.setIndex(triangles);
          geometry.computeVertexNormals();
          this.geometry = geometry;
        }
      });

      AFRAME.registerGeometry('hollow-log', {
        init() {
          const { BufferGeometry, Color, Float32BufferAttribute } = AFRAME.THREE;
          // Follow the cross-section from bark to cut wood and back along the hollow.
          // Each row gives the distance along the log, radius, and wood color.
          const profile = [
            [-1.72, 0.87, '#49322e'],
            [-1.05, 0.93, '#563b34'],
            [-0.30, 0.96, '#4b342e'],
            [0.51, 0.98, '#563a31'],
            [1.13, 1.01, '#50372f'],
            [1.70, 1.02, '#4d342c'],
            [1.75, 0.96, '#684738'],
            [1.76, 0.93, '#ad7950'],
            [1.76, 0.896, '#76503b'],
            [1.76, 0.868, '#b48155'],
            [1.76, 0.824, '#82593e'],
            [1.76, 0.793, '#b98556'],
            [1.75, 0.761, '#8c5d42'],
            [1.67, 0.728, '#5d3d30'],
            [1.08, 0.707, '#50352c'],
            [0.46, 0.666, '#5c3b2c'],
            [-0.25, 0.616, '#483025'],
            [-1.02, 0.514, '#3a2824'],
            [-1.60, 0.396, '#3d2a23'],
            [-1.71, 0.46, '#60402d'],
            [-1.74, 0.66, '#785035'],
            [-1.73, 0.80, '#674335']
          ];
          const sides = 56;
          const positions = [];
          const colors = [];
          const triangles = [];

          for (const [ring, [z, radius, tone]] of profile.entries()) {
            const color = new Color(tone);
            for (let side = 0; side < sides; side++) {
              const angle = 2 * Math.PI * side / sides;
              const ridge = Math.sin(11 * angle - z * 0.6);
              const outline = 1 + 0.033 * Math.sin(5 * angle + z * 0.45) + 0.037 * ridge;
              const roughEdge = 0.091 * Math.sin(3 * angle + z * 0.35) +
                0.045 * Math.cos(8 * angle - z * 0.28);
              const shade = 0.91 + 0.11 * ridge + 0.07 * Math.cos(17 * angle + z * 0.3);
              positions.push(
                Math.cos(angle) * radius * outline,
                Math.sin(angle) * radius * outline * 0.89,
                z + roughEdge
              );
              colors.push(color.r * shade, color.g * shade, color.b * shade);

              const next = (side + 1) % sides;
              const nextRing = (ring + 1) % profile.length;
              const current = ring * sides + side;
              const beside = ring * sides + next;
              const ahead = nextRing * sides + side;
              const diagonal = nextRing * sides + next;
              triangles.push(current, beside, ahead, beside, diagonal, ahead);
            }
          }

          const geometry = new BufferGeometry();
          geometry.setAttribute('position', new Float32BufferAttribute(positions, 3));
          geometry.setAttribute('color', new Float32BufferAttribute(colors, 3));
          geometry.setIndex(triangles);
          geometry.computeVertexNormals();
          this.geometry = geometry;
        }
      });

      AFRAME.registerComponent('fireflies', {
        init() {
          const { AdditiveBlending, CanvasTexture, Group, Sprite, SpriteMaterial, SRGBColorSpace } = AFRAME.THREE;
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = 64;
          const context = canvas.getContext('2d');
          const glow = context.createRadialGradient(32, 32, 0, 32, 32, 32);
          glow.addColorStop(0, '#ffffff');
          glow.addColorStop(0.11, '#ffffff');
          glow.addColorStop(0.22, 'rgba(255, 255, 255, 0.63)');
          glow.addColorStop(0.52, 'rgba(255, 255, 255, 0.13)');
          glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
          context.fillStyle = glow;
          context.fillRect(0, 0, 64, 64);
          this.texture = new CanvasTexture(canvas);
          this.texture.colorSpace = SRGBColorSpace;

          // Small pockets near the roots and mushrooms, with dark gaps between them.
          const centers = [
            [-0.87, 0.69, 0.63], [-1.65, 1.16, -0.6], [-2.09, 0.83, 0.47],
            [1.66, 0.79, -2.05], [0.26, 1.22, -4.73], [2.12, 1.5, -4.85],
            [-1.17, 2.02, -10.64], [-0.27, 1.45, -11.4], [5.86, 1.13, -9.53],
            [-2.18, 0.75, 5.1], [2.75, 1.25, 6.71], [3.3, 1.76, 7.81]
          ];
          const group = new Group();
          this.flies = centers.map(([x, y, z], index) => {
            const sprite = new Sprite(new SpriteMaterial({
              map: this.texture,
              color: index % 3 === 0 ? '#ffc16c' : '#ffe39a',
              opacity: 0.18,
              blending: AdditiveBlending,
              depthWrite: false
            }));
            const size = 0.19 + (index % 4) * 0.045;
            sprite.scale.set(size, size, 1);
            sprite.position.set(x, y, z);
            group.add(sprite);

            return { sprite, x, y, z, phase: index * 2.4, speed: 0.55 + (index % 5) * 0.13 };
          });
          this.el.setObject3D('fireflies', group);
        },
        tick(time) {
          const seconds = time / 1000;
          for (const { sprite, x, y, z, phase, speed } of this.flies) {
            const angle = seconds * speed + phase;
            sprite.position.set(
              x + 0.32 * Math.cos(angle),
              y + 0.14 * Math.sin(angle * 1.23),
              z + 0.23 * Math.sin(angle)
            );
            const pulse = Math.max(0, Math.sin(seconds * (speed + 0.55) + phase));
            sprite.material.opacity = 0.16 + 0.78 * pulse ** 5;
          }
        },
        remove() {
          this.el.removeObject3D('fireflies');
          for (const { sprite } of this.flies) {
            sprite.material.dispose();
          }
          this.texture.dispose();
        }
      });

      let breezeEnabled = true;
      AFRAME.registerComponent('breeze', {
        dependencies: ['rotation'],
        schema: {
          degrees: { default: 2.2 },
          period: { default: 8.4 },
          phase: { default: 0 }
        },
        init() {
          this.rest = this.el.object3D.rotation.clone();
          this.weight = 1;
        },
        tick(time, delta) {
          const { degrees, period, phase } = this.data;
          const rotation = this.el.object3D.rotation;
          const angle = time * 2 * Math.PI / (period * 1000) + phase;
          const target = breezeEnabled ? 1 : 0;
          this.weight += (target - this.weight) * Math.min((delta || 0) / 420, 1);
          if (Math.abs(target - this.weight) < 0.001) {
            this.weight = target;
          }
          const gust = 0.83 + 0.15 * Math.sin(time / 2400 + phase * 0.5);
          const amount = this.weight * gust * degrees * Math.PI / 180;
          rotation.z = this.rest.z + amount * Math.sin(angle);
          rotation.x = this.rest.x + amount * 0.42 * Math.sin(angle * 0.76 + phase);
        }
      });
    </script>
    <style>
      #breeze-toggle {
        position: fixed;
        inset: 1rem auto auto 1rem;
        z-index: 10;
        padding: 0.55rem 0.85rem;
        border: 1px solid #77705d;
        border-radius: 0.5rem;
        background: #17252a;
        color: #fff3d5;
        font: 600 0.92rem system-ui, sans-serif;
        cursor: pointer;
      }

      #breeze-toggle:focus-visible {
        outline: 2px solid #ffe1a2;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <a-scene fog="type: exponential; color: #1b293c; density: 0.048">
      <!-- 1. Wrap the 2:1 night image around the scene. -->
      <a-assets>
        <img id="night-sky" src="./images/night-sky.png" alt="">
        <img id="bark-texture" src="./images/bark-texture.png" alt="">
        <img id="soil-texture" src="./images/soil-texture.png" alt="">
        <img id="mushroom-gill-texture" src="./images/mushroom-gills.png" alt="">
        <a-mixin id="bark" material="color: #543838; roughness: 1"></a-mixin>
        <a-mixin id="trunk-bark" material="color: #5c3f3d; src: #bark-texture; repeat: 1 2; anisotropy: 4; roughness: 1"></a-mixin>
        <a-mixin id="canopy" material="color: #284c45; roughness: 1"></a-mixin>
        <a-mixin id="stem" material="color: #427b63; roughness: 0.9"></a-mixin>
        <a-mixin id="petal" material="color: #eaa4c5; emissive: #a94072; emissiveIntensity: 0.55; roughness: 0.8"></a-mixin>
        <a-mixin id="pollen" material="color: #fff0ad; emissive: #ffb751; emissiveIntensity: 0.9"></a-mixin>
        <a-mixin id="bud" material="color: #83e2cb; emissive: #46b69c; emissiveIntensity: 0.65"></a-mixin>
        <a-mixin id="understory-leaf" geometry="primitive: sphere; segmentsWidth: 16; segmentsHeight: 10"
          material="color: #3e7059; roughness: 0.9"></a-mixin>
        <a-mixin id="mushroom-stalk" material="color: #ddc7ae; roughness: 0.95"></a-mixin>
        <a-mixin id="red-gills" geometry="primitive: circle; radius: 0.631; segments: 48"
          position="0 0.677 0" rotation="90 0 0"
          material="color: #efd4ae; src: #mushroom-gill-texture; emissive: #a16443; emissiveMap: #mushroom-gill-texture; emissiveIntensity: 0.25; roughness: 1"></a-mixin>
        <a-mixin id="amber-gills" geometry="primitive: circle; radius: 0.713; segments: 48"
          position="0 0.836 0" rotation="90 0 0"
          material="color: #e0a56d; src: #mushroom-gill-texture; emissive: #bb7238; emissiveMap: #mushroom-gill-texture; emissiveIntensity: 0.42; roughness: 1"></a-mixin>
        <a-mixin id="plum-gills" geometry="primitive: circle; radius: 0.528; segments: 48"
          position="0 0.541 0" rotation="90 0 0"
          material="color: #c9a5cc; src: #mushroom-gill-texture; emissive: #866294; emissiveMap: #mushroom-gill-texture; emissiveIntensity: 0.4; roughness: 1"></a-mixin>
        <a-mixin id="mushroom-spot" geometry="primitive: sphere; segmentsWidth: 12; segmentsHeight: 8"
          material="color: #fff5e6; emissive: #b6a89a; emissiveIntensity: 0.15; roughness: 0.95"></a-mixin>
        <a-mixin id="fallen-leaf" geometry="primitive: curled-leaf"
          material="side: double; vertexColorsEnabled: true; roughness: 1"></a-mixin>
        <a-mixin id="ground-moss" geometry="primitive: moss-patch"
          material="vertexColorsEnabled: true; roughness: 1"></a-mixin>
        <a-mixin id="mossy-bark" material="color: #ffffff; vertexColorsEnabled: true; roughness: 1"></a-mixin>
      </a-assets>
      <a-sky src="#night-sky" material="fog: true" sky-haze></a-sky>

      <a-plane rotation="-90 0 0" width="400" height="400"
        material="color: #2a433c; src: #soil-texture; repeat: 144 144; anisotropy: 8; roughness: 1"></a-plane>

      <!-- 2. Build a giant tree from a tapered trunk, branches, and round crowns. -->
      <a-entity id="giant-tree" position="-4.8 0 -7" scale="1.85 2.25 1.85">
        <a-cone mixin="trunk-bark" position="0 3 0" height="6"
          radius-bottom="0.78" radius-top="0.28"></a-cone>
        <a-sphere mixin="bark" position="0.47 0.18 0.33" radius="0.65"
          rotation="0 37 0" scale="1.8 0.46 0.5"></a-sphere>
        <a-sphere mixin="bark" position="-0.42 0.16 0.27" radius="0.62"
          rotation="0 -25 0" scale="1.6 0.44 0.5"></a-sphere>
        <a-cone mixin="trunk-bark" position="-0.66 4.5 0" rotation="0 0 38"
          height="2.85" radius-bottom="0.34" radius-top="0.12"></a-cone>
        <a-cone mixin="trunk-bark" position="0.75 4.8 -0.05" rotation="0 0 -40"
          height="2.9" radius-bottom="0.3" radius-top="0.11"></a-cone>
        <a-sphere mixin="canopy" position="-1.28 5.8 0.05" radius="1.55" scale="1.15 0.75 1"></a-sphere>
        <a-sphere mixin="canopy" position="1.35 6 -0.3" radius="1.63" scale="1.15 0.8 1"></a-sphere>
        <a-sphere position="0 6.65 0" radius="1.9" scale="1.12 0.83 1"
          material="color: #365d50; roughness: 1"></a-sphere>
      </a-entity>

      <!-- Stagger trunks around the viewer and across gaps in the undergrowth. -->
      <a-entity id="background-trees" scale="1 2.05 1">
        <a-cone mixin="trunk-bark" position="-8 3.1 -11" height="6.2" radius-bottom="0.6" radius-top="0.27"></a-cone>
        <a-sphere mixin="canopy" position="-8 6.1 -11" radius="2.3" scale="1.6 0.8 1.45"></a-sphere>
        <a-cone mixin="trunk-bark" position="-4.1 3.8 -17" height="7.6" radius-bottom="0.88" radius-top="0.3"></a-cone>
        <a-sphere mixin="canopy" position="-4.1 7.5 -17" radius="2.4" scale="1.75 0.8 1.5"></a-sphere>
        <a-cone mixin="trunk-bark" position="4.1 3.4 -20" height="6.8" radius-bottom="0.8" radius-top="0.25"></a-cone>
        <a-sphere mixin="canopy" position="4.1 6.7 -20" radius="2.5" scale="1.8 0.8 1.55"></a-sphere>
        <a-cone mixin="trunk-bark" position="5.6 4 -15" height="8" radius-bottom="0.75" radius-top="0.3"></a-cone>
        <a-sphere mixin="canopy" position="5.6 7.7 -15" radius="2.9" scale="1.5 0.68 1.4"></a-sphere>
        <a-cone mixin="trunk-bark" position="8.1 3.3 -7.5" height="6.6" radius-bottom="0.62" radius-top="0.22"></a-cone>
        <a-sphere mixin="canopy" position="8.1 6.45 -7.5" radius="2.2" scale="1.7 0.82 1.4"></a-sphere>
        <a-cone mixin="trunk-bark" position="4.9 3.6 -1" height="7.2" radius-bottom="1.13" radius-top="0.38"></a-cone>
        <a-sphere mixin="canopy" position="4.9 6.95 -1" radius="2.5" scale="1.8 0.82 1.45"></a-sphere>
        <a-cone mixin="trunk-bark" position="-5.2 3.25 4" height="6.5" radius-bottom="1" radius-top="0.29"></a-cone>
        <a-sphere mixin="canopy" position="-5.2 6.2 4" radius="2.3" scale="1.8 0.82 1.45"></a-sphere>
        <a-cone mixin="trunk-bark" position="-7.7 3.45 -1.5" height="6.9" radius-bottom="0.87" radius-top="0.31"></a-cone>
        <a-sphere mixin="canopy" position="-7.7 6.7 -1.5" radius="2.4" scale="1.55 0.82 1.5"></a-sphere>
        <a-cone mixin="trunk-bark" position="4.0 3.5 -9.9" height="7" radius-bottom="0.95" radius-top="0.32"></a-cone>
        <a-sphere mixin="canopy" position="4.0 6.9 -9.9" radius="2.55" scale="1.72 0.82 1.48"></a-sphere>
        <a-cone mixin="trunk-bark" position="-4 3.35 -11.7" height="6.7" radius-bottom="0.8" radius-top="0.27"></a-cone>
        <a-sphere mixin="canopy" position="-4 6.45 -11.7" radius="2.45" scale="1.76 0.82 1.5"></a-sphere>
        <a-cone mixin="trunk-bark" position="-10.1 3.6 -17.4" height="7.2" radius-bottom="1" radius-top="0.3"></a-cone>
        <a-sphere mixin="canopy" position="-10.1 6.9 -17.4" radius="2.6" scale="1.6 0.8 1.5"></a-sphere>
        <a-cone mixin="trunk-bark" position="9.8 3.4 -19.5" height="6.8" radius-bottom="0.94" radius-top="0.29"></a-cone>
        <a-sphere mixin="canopy" position="9.8 6.5 -19.5" radius="2.55" scale="1.6 0.8 1.4"></a-sphere>
        <a-cone mixin="trunk-bark" position="-5.5 3.6 -24.2" height="7.2" radius-bottom="0.97" radius-top="0.28"></a-cone>
        <a-sphere mixin="canopy" position="-5.5 7 -24.2" radius="2.55" scale="1.72 0.8 1.5"></a-sphere>

    <button type="button" id="breeze-toggle" aria-label="Breeze" aria-pressed="true" hidden>Breeze on</button>
    <script>
      const forestLayers = document.getElementById('forest-layers');
      // Foreground and midground trees, listed as x, z, trunk height, and base radius.
      const trees = [
        [-2.45, -1.3, 14.3, 1.02],
        [2.4, 0.5, 13.1, 0.8],
        [3.65, 4.55, 15.5, 1.05],
        [-3.1, 4.8, 16.4, 0.88],
        [-1.9, 8, 12.2, 1.16],
        [4.45, 10.9, 15.1, 0.92],
        [-8.2, 5.5, 14.9, 1.1],
        [8.1, 9.5, 16.7, 1.15],
        [7.85, -2.9, 12.7, 1.05],
        [-6.5, -4.5, 15.1, 0.97],
        [-1.6, -6.95, 14.6, 1.18],
        [1.5, -12.7, 13.3, 0.89],
        [6.25, -5.25, 14.4, 0.82],
        [-4.3, 8, 16.2, 0.88],
        [-0.7, 12, 12.7, 0.85],
        [9, -12, 15.2, 1.14],
        [3.6, -15.8, 16.3, 0.9],
        [-1.6, -17, 15.8, 0.86]
      ];
      const treeLayers = [
        { count: 22, radius: 16, spread: 4, offset: 0.12 },
        { count: 32, radius: 31, spread: 7, offset: 0.32 }
      ];

      for (const layer of treeLayers) {
        for (let tree = 0; tree < layer.count; tree++) {
          // Each layer wraps around the player, with uneven spacing and tree heights.
          const variation = Math.sin(tree * 2.4 + layer.offset);
          const angle = 2 * Math.PI * tree / layer.count + layer.offset + 0.08 * variation;
          const distance = layer.radius + layer.spread * variation;
          const x = (distance * Math.cos(angle)).toFixed(2);
          const z = (3.5 + distance * Math.sin(angle)).toFixed(2);
          const height = 13.5 + 3.0 * Math.sin(tree * 1.7 + layer.offset);
          const width = 0.95 + 0.3 * variation;
          trees.push([x, z, height, width]);
        }
      }

      for (const [x, z, height, width] of trees) {
        const variation = (width - 0.95) / 0.3;
        const crown = 3.4 + 0.55 * variation;
        forestLayers.insertAdjacentHTML('beforeend', `
          <a-entity position="${x} 0 ${z}">
            <a-cone mixin="trunk-bark" position="0 ${height / 2} 0" height="${height}"
              radius-bottom="${width}" radius-top="${width * 0.32}" segments-radial="10"></a-cone>
            <a-sphere mixin="canopy" position="0 ${height * 0.92} 0" radius="${crown}"
              scale="1.18 0.86 1" segments-width="14" segments-height="10"></a-sphere>
            <a-sphere mixin="canopy" position="${variation * 2} ${height * 0.81} 0.9" radius="${crown * 0.7}"
              scale="1.15 0.7 1" segments-width="14" segments-height="10"></a-sphere>
          </a-entity>
        `);
      }

      const petalColors = {
        blue: { color: '#a1d9ff', emissive: '#467cb6' },
        apricot: { color: '#ffc29a', emissive: '#b36238' },
        magenta: { color: '#d36ba9', emissive: '#932575' }
      };
      for (const copy of document.querySelectorAll('[data-flower], [data-copy]')) {
        const original = document.getElementById(copy.dataset.flower ?? copy.dataset.copy);
        for (const part of original.children) {
          copy.append(part.cloneNode(true));
        }
        const petals = petalColors[copy.dataset.petals];
        if (petals) {
          for (const petal of copy.querySelectorAll('[mixin="petal"]')) {
            petal.setAttribute('material', petals);
          }
        }
      }

      // Add the textured undersides after cloning so they appear on marked caps only.
      for (const mushroom of document.querySelectorAll('[data-gills]')) {
        const underside = document.createElement('a-entity');
        underside.setAttribute('mixin', mushroom.dataset.gills);
        mushroom.append(underside);
      }

      const flowers = document.querySelectorAll('#giant-flower, #lavender-flower, [data-flower]');
      flowers.forEach((flower, index) => {
        const head = flower.querySelector('a-entity');
        head.setAttribute('breeze', {
          degrees: 2.35 + ((index + 2) % 4) * 0.17,
          period: 7.8 + (index % 5) * 0.7,
          phase: index * 1.65
        });
      });

      const understory = document.querySelectorAll('#forest-leaves, [data-copy="forest-leaves"]');
      understory.forEach((plant, index) => {
        if (plant.hasAttribute('data-sheltered')) return;
        const fan = plant.querySelector('[data-leaf-fan]');
        fan.setAttribute('breeze', {
          degrees: 1.65 + (index % 4) * 0.16,
          period: 7.3 + (index % 5) * 0.65,
          phase: index * 1.58 + 0.7
        });
      });

      const crowns = document.querySelectorAll(
        '#giant-tree > a-sphere:not([mixin="bark"]), #background-trees > a-sphere'
      );
      crowns.forEach((crown, index) => {
        if (index > 2 && index % 4 !== 0) return;
        crown.setAttribute('breeze', {
          degrees: 0.95 + (index % 3) * 0.16,
          period: 11.8 + (index % 4) * 0.85,
          phase: index * 1.94 + 0.4
        });
      });

      const breezeToggle = document.getElementById('breeze-toggle');
      breezeToggle.addEventListener('click', () => {
        breezeEnabled = !breezeEnabled;
        breezeToggle.setAttribute('aria-pressed', String(breezeEnabled));
        breezeToggle.textContent = breezeEnabled ? 'Breeze on' : 'Breeze off';
      });
