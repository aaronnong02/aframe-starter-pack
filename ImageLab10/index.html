<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>

      <!-- assets -->
      <a-assets>
        <img id="sky" src="./images/sky.jpg" />
        <img id="sand" src="./images/sand.jpg" />
        <img id="waffle" src="./images/waffle.jpg" />
      </a-assets>

      <!-- equirectangular background -->
      <a-sky src="#sky" rotation="0 270 0"></a-sky>

      <!-- sand ground -->
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="100"
        height="100"
        material="src: #sand; repeat: 40 40; color: #f5e5cd; roughness: 1"
        shadow="cast: false; receive: true"
      ></a-plane>


      <!-- big strawberry ice cream -->
      <a-entity position="-2.5 0 -5" rotation="0 12 -6" shadow="cast: true; receive: true">
        <!-- ice cream cone -->
        <a-cone
          position="0 1.1 0"
          height="2.2"
          radius-bottom="0.05"
          radius-top="0.7"
          material="src: #waffle; repeat: 3 2; roughness: 1"
        ></a-cone>

        <!-- strawberry scoop -->
        <a-sphere
          position="0 2.65 0"
          radius="0.9"
          color="#ff9fbe"
          roughness="0.85"
        ></a-sphere>

        <!-- scoops -->
        <a-sphere position="-0.52 2.12 0.25" radius="0.32" color="#ff9fbe" roughness="0.85"></a-sphere>
        <a-sphere position="0 2.08 0.53" radius="0.34" color="#ff9fbe" roughness="0.85"></a-sphere>
        <a-sphere position="0.52 2.12 0.25" radius="0.32" color="#ff9fbe" roughness="0.85"></a-sphere>
        <a-cylinder position="-0.35 2.85 0.79" radius="0.025" height="0.18" rotation="0 0 35" color="#fff4da"></a-cylinder>
        <a-cylinder position="0.27 3.08 0.72" radius="0.025" height="0.16" rotation="0 0 -45" color="#42bfc1"></a-cylinder>
        <a-cylinder position="0.52 2.59 0.74" radius="0.025" height="0.18" rotation="0 0 65" color="#fff4da"></a-cylinder>
        <a-cylinder position="-0.17 2.42 0.86" radius="0.025" height="0.16" rotation="0 0 -30" color="#c94d69"></a-cylinder>
        <a-cylinder position="-0.65 2.65 0.6" radius="0.025" height="0.16" rotation="0 0 50" color="#42bfc1"></a-cylinder>
        <a-cylinder position="0.02 3.36 0.51" radius="0.025" height="0.15" rotation="20 0 60" color="#fff4da"></a-cylinder>

        <!-- cherry on top -->
        <a-sphere
          position="0 3.58 0"
          radius="0.18"
          color="#c92748"
        ></a-sphere>

        <!-- cherry stem -->
        <a-cylinder
          position="0.04 3.82 0"
          radius="0.025"
          height="0.25"
          rotation="0 0 -20"
          color="#4f743c"
        ></a-cylinder>
      </a-entity>

      <!-- sand castle -->
      <a-entity position="2.3 0 -6" rotation="0 -12 0" shadow="cast: true; receive: true">
        <!-- base -->
        <a-box
          position="0 0.65 0"
          width="2.4"
          height="1.3"
          depth="1.5"
          material="src: #sand; repeat: 2 1; roughness: 1"
        ></a-box>

        <!-- left tower -->
        <a-cylinder
          position="-1.2 1 0"
          radius="0.5"
          height="2"
          material="src: #sand; repeat: 2 2; roughness: 1"
        ></a-cylinder>

        <!-- left tower roof -->
        <a-cone
          position="-1.2 2.35 0"
          radius-bottom="0.65"
          radius-top="0"
          height="0.7"
          material="src: #sand; roughness: 1"
        ></a-cone>

        <!-- right tower -->
        <a-cylinder
          position="1.2 1 0"
          radius="0.5"
          height="2"
          material="src: #sand; repeat: 2 2; roughness: 1"
        ></a-cylinder>

        <!-- right tower roof -->
        <a-cone
          position="1.2 2.35 0"
          radius-bottom="0.65"
          radius-top="0"
          height="0.7"
          material="src: #sand; roughness: 1"
        ></a-cone>

        <!-- wall top -->
        <a-box
          position="-0.65 1.5 0"
          width="0.35"
          height="0.4"
          depth="1.5"
          src="#sand"
        ></a-box>

        <a-box
          position="0 1.5 0"
          width="0.35"
          height="0.4"
          depth="1.5"
          src="#sand"
        ></a-box>

        <a-box
          position="0.65 1.5 0"
          width="0.35"
          height="0.4"
          depth="1.5"
          src="#sand"
        ></a-box>

        <!-- door -->
        <a-box
          position="0 0.3 0.76"
          width="0.5"
          height="0.6"
          depth="0.03"
          color="#65452d"
        ></a-box>
        <a-circle position="0 0.6 0.78" radius="0.25" theta-length="180" color="#65452d"></a-circle>

        <!-- flag -->
        <a-cylinder
          position="0 2.05 0"
          radius="0.025"
          height="1.5"
          color="#fff4da"
        ></a-cylinder>

        <a-plane
          position="0.28 2.6 0"
          width="0.55"
          height="0.35"
          color="#ed7188"
          side="double"
        ></a-plane>
      </a-entity>

      <!-- beach towel -->
      <a-entity id="beach-towel" position="0 0.025 2" shadow="cast: true; receive: true">
        <a-box width="1.4" height="0.04" depth="2.4" color="#fff4da" roughness="1"></a-box>
        <a-box position="0 0.025 -0.9" width="1.4" height="0.01" depth="0.22" color="#ff7790"></a-box>
        <a-box position="0 0.025 -0.45" width="1.4" height="0.01" depth="0.22" color="#ff7790"></a-box>
        <a-box position="0 0.025 0" width="1.4" height="0.01" depth="0.22" color="#ff7790"></a-box>
        <a-box position="0 0.025 0.45" width="1.4" height="0.01" depth="0.22" color="#ff7790"></a-box>
        <a-box position="0 0.025 0.9" width="1.4" height="0.01" depth="0.22" color="#ff7790"></a-box>
        <!-- fringes -->
        <a-box position="-0.60 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="-0.50 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="-0.40 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="-0.30 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="-0.20 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="-0.10 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.00 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.10 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.20 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.30 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.40 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.50 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.60 0 -1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="-0.60 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="-0.50 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="-0.40 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="-0.30 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="-0.20 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="-0.10 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.00 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.10 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.20 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.30 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.40 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.50 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
        <a-box position="0.60 0 1.25" width="0.025" height="0.018" depth="0.14" color="#fff4da" roughness="1"></a-box>
      </a-entity>

      <!-- beach umbrella -->
      <a-entity id="beach-umbrella" position="1.8 0 0.9" shadow="cast: true; receive: true">
        <a-cylinder position="0 1.3 0" radius="0.035" height="2.6" color="#e8c797"></a-cylinder>

        <a-entity position="0 2.2 0" scale="1 0.42 1">
          <a-sphere radius="1.35" theta-length="75" phi-start="0" phi-length="45" color="#32b9bd" side="double" roughness="0.9"></a-sphere>
          <a-sphere radius="1.35" theta-length="75" phi-start="45" phi-length="45" color="#fff4da" side="double" roughness="0.9"></a-sphere>
          <a-sphere radius="1.35" theta-length="75" phi-start="90" phi-length="45" color="#32b9bd" side="double" roughness="0.9"></a-sphere>
          <a-sphere radius="1.35" theta-length="75" phi-start="135" phi-length="45" color="#fff4da" side="double" roughness="0.9"></a-sphere>
          <a-sphere radius="1.35" theta-length="75" phi-start="180" phi-length="45" color="#32b9bd" side="double" roughness="0.9"></a-sphere>
          <a-sphere radius="1.35" theta-length="75" phi-start="225" phi-length="45" color="#fff4da" side="double" roughness="0.9"></a-sphere>
          <a-sphere radius="1.35" theta-length="75" phi-start="270" phi-length="45" color="#32b9bd" side="double" roughness="0.9"></a-sphere>
          <a-sphere radius="1.35" theta-length="75" phi-start="315" phi-length="45" color="#fff4da" side="double" roughness="0.9"></a-sphere>
        </a-entity>
        <a-torus position="0 2.347 0" rotation="90 0 0" radius="1.304" radius-tubular="0.018" color="#fff4da"></a-torus>
        <a-sphere position="0 2.79 0" radius="0.055" color="#fff4da"></a-sphere>
      </a-entity>

      <!-- sun hat -->
      <a-entity position="-1.2 0.02 0.65" rotation="0 18 0" shadow="cast: true; receive: true">
        <a-cylinder position="0 0.07 0" radius="0.36" height="0.12" color="#dfbc83" roughness="1"></a-cylinder>
        <a-sphere position="0 0.15 0" radius="0.24" scale="1 0.72 1" color="#e8cb98" roughness="1"></a-sphere>
        <a-cylinder position="0 0.17 0" radius="0.245" height="0.055" color="#ed7188"></a-cylinder>
      </a-entity>

      <!-- beach ball -->
      <a-entity position="-1.7 0.32 -1.6" rotation="0 -20 12" shadow="cast: true; receive: true">
        <a-sphere radius="0.32" color="#fff4da" roughness="0.65"></a-sphere>
        <a-sphere radius="0.322" phi-start="0" phi-length="60" color="#ed7188" roughness="0.65"></a-sphere>
        <a-sphere radius="0.322" phi-start="120" phi-length="60" color="#32b9bd" roughness="0.65"></a-sphere>
        <a-sphere radius="0.322" phi-start="240" phi-length="60" color="#f3c361" roughness="0.65"></a-sphere>
      </a-entity>

      <!-- starting viewpoint -->
      <a-camera position="0 1.6 2"></a-camera>
    </a-scene>
  </body>
</html>
